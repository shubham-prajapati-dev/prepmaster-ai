name: PrepMaster CI

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install workspaces
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Check backend JavaScript syntax
        run: |
          node --check server/src/server.js
          node --check server/src/app.js
          node --check server/src/config/db.js
          node --check server/src/routes/ai.routes.js
          node --check server/src/services/aiService.js
